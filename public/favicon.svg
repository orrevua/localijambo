<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Localijambo">
  <defs>
    <radialGradient id="jv-skin" cx="0.38" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#E0496B"/>
      <stop offset="0.45" stop-color="#B71F45"/>
      <stop offset="1" stop-color="#651030"/>
    </radialGradient>
    <radialGradient id="jv-crater" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#4A0A20"/>
      <stop offset="1" stop-color="#7C1634"/>
    </radialGradient>
  </defs>
  <!-- leaf -->
  <path d="M34 9 C39 2.5 48 2 53 5 C49 11.5 41 13 35.5 10.5 Z" fill="#6FAE7F"/>
  <path d="M35.5 10.3 C40.5 8 46 6.4 51 5.4" fill="none" stroke="#3F7F55" stroke-width="1.1" stroke-linecap="round"/>
  <!-- stem -->
  <path d="M31.5 6 C32 8.5 32 10.5 32 13" fill="none" stroke="#5B4A2E" stroke-width="2.4" stroke-linecap="round"/>
  <!-- bell-shaped fruit: narrow at the stem, broad at the base -->
  <path d="M32 12 C24.5 12 19.6 16.3 18.6 22.5 C17.6 29 13.8 33.8 13.8 42 C13.8 51.2 21.5 57.6 32 57.6 C42.5 57.6 50.2 51.2 50.2 42 C50.2 33.8 46.4 29 45.4 22.5 C44.4 16.3 39.5 12 32 12 Z"
        fill="url(#jv-skin)"/>
  <!-- soft lighter patch, like the pinkish areas on the skin -->
  <path d="M40 30 C45 34 47.5 40 46.5 46 C45 41 42.5 36 38.5 33 Z" fill="#E86A86" opacity="0.35"/>
  <!-- sunken calyx crater with four persistent sepals folding inward -->
  <ellipse cx="32" cy="52" rx="7.6" ry="3.3" fill="#8E1A3B"/>
  <ellipse cx="32" cy="52.3" rx="5.6" ry="2.3" fill="url(#jv-crater)"/>
  <g fill="#D3C670">
    <ellipse cx="29.3" cy="52.2" rx="1.6" ry="0.85"/>
    <ellipse cx="34.7" cy="52.2" rx="1.6" ry="0.85"/>
    <ellipse cx="32" cy="50.9" rx="0.95" ry="0.75"/>
    <ellipse cx="32" cy="53.5" rx="0.95" ry="0.75"/>
  </g>
  <!-- gloss + lenticel speckles -->
  <ellipse cx="24.5" cy="29" rx="3" ry="6.5" transform="rotate(20 24.5 29)" fill="#fff" opacity="0.45"/>
  <ellipse cx="23.2" cy="38.5" rx="1.4" ry="2.4" fill="#fff" opacity="0.28"/>
  <g fill="#FFD9E0" opacity="0.55">
    <circle cx="30" cy="22" r="0.55"/><circle cx="36" cy="26" r="0.5"/><circle cx="39" cy="38" r="0.55"/>
    <circle cx="28" cy="44" r="0.5"/><circle cx="34" cy="34" r="0.45"/><circle cx="43" cy="45" r="0.5"/>
    <circle cx="21" cy="46" r="0.45"/><circle cx="35" cy="47" r="0.5"/>
  </g>
</svg>
